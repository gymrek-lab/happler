[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "happler-fm"
version = "0.0.1"
description = "A haplotype-based fine-mapping method"
authors = [
    {name = "Arya Massarat"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.6.2",
    "pydot>=1.4.2",
    "scipy>=1.12",
    "click>=8.0.4",
    "pysam>=0.21.0",
    "numpy>=1.26",
    "networkx>=2.6.3",
    "haptools>=0.6.2",
    "statsmodels>=0.13.3",
]

[tool.poetry.dependencies]
jax = [
    { version = "0.6.2", markers = "python_version <= '3.11'" },
    { version = "0.11.2", markers = "python_version > '3.11'" },
]
pydot = [
    { version = "1.4.2" , markers = "python_version <= '3.11'" },
    { version = "4.0.1" , markers = "python_version > '3.11'" },
]
scipy = [
    { version = "1.12" , markers = "python_version <= '3.11'" },
    { version = "1.18.1" , markers = "python_version > '3.11'" },
]
click = [
    { version = "8.0.4" , markers = "python_version <= '3.11'" },
    { version = "8.5.0" , markers = "python_version > '3.11'" },
]
pysam = [
    { version = "0.21.0" , markers = "python_version <= '3.11'" },
    { version = "0.24.1" , markers = "python_version > '3.11'" },
]
numpy = [
    { version = "1.26" , markers = "python_version <= '3.11'" },
    { version = "2.5.4" , markers = "python_version > '3.11'" },
]
networkx = [
    { version = "2.6.3" , markers = "python_version <= '3.11'" },
    { version = "3.6" , markers = "python_version > '3.11'" },
]
haptools = [
    { version = "0.6.2" },
]
statsmodels = [
    { version = "0.13.3" , markers = "python_version <= '3.11'" },
    { version = "0.15.0" , markers = "python_version > '3.11'" },
]

[project.urls]
repository = "https://github.com/gymrek-lab/happler"
homepage = "https://github.com/gymrek-lab/happler"
documentation = "https://haptools.readthedocs.io"
changelog = "https://github.com/gymrek-lab/happler/blob/main/CHANGELOG.md"

[project.scripts]
happler = 'happler.__main__:main'

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{include = "happler"}]

[tool.poetry.group.docs.dependencies]
sphinx = ">=4.3.2"
sphinx-autodoc-typehints = ">=1.13.0"
sphinx-rtd-theme = ">=1.0.0"
numpydoc = ">=1.1.0"
sphinx-click = ">=3.0.2"

[tool.poetry.group.tests.dependencies]
pytest = ">=7.4.3"
black = [
    { version = ">=23.3.0" , markers = "python_version <= '3.11'" },
    { version = ">=25.1.0" , markers = "python_version > '3.11'" },
]
ipython = ">=7.34.0"
coverage = {extras = ["toml"], version = ">=7.2.7"}

[tool.poetry.requires-plugins]
poetry-conda = ">=0.1.4"
poetry-plugin-export = ">=1.9"
poetry-plugin-shell = ">=1.0.1"

[tool.black]
line-length = 90
preview = true
extend-exclude = "analysis/"

[tool.pytest.ini_options]
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
